kind = "web"
title = "AegisAPI Website"
version = "1.0.0"
id = "artifacts/ageisapi-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]

[services.production]
build = [ "bash", "-c", "BASE_PATH=/ PORT=3000 pnpm --filter @workspace/aegisapi-website run build" ]
publicDir = "artifacts/ageisapi-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
BASE_PATH = "/"
